[technology-description]
pm-alloying=Die Grundlagen der Legierungsherstellung.
pm-welder-1-unlock=Ein einfaches Schweißgerät, das zum Schmelzen von Legierungen verwendet wird.
pm-electronic-circuit-molding=Eine alternative Methode zur Herstellung einfacher Leiterplatten, bei der Harz anstelle von Metall verwendet wird.
pm-advanced-basic-tubing=Wenn man teurere Materialien verwendet, kann man mehr Produkte herstellen – wer hätt's gedacht.
pm-basic-polyethylene-plastic=Eine einfache Methode zur Herstellung von Polyethylen-Kunststoff. Sie ist zwar nicht besonders effizient, erfüllt aber ihren Zweck.
pm-bio-module-agility=Durch die Verwendung des Genoms Phosphoramidit kannst Du Reichweite und Laufgeschwindigkeit erhöhen und so eine höhere Wirksamkeit erzielen.
pm-processing-circuit-molding=Eine alternative Methode zur Herstellung von Steckplatinen.
pm-speed-module=Ein aufgemotztes Tempomodul, das eine Maschine schneller laufen lässt – manche behaupten, dass an der Seite Flammen aufgemalt sind, damit sie schneller läuft. Das lässt sich allerdings nicht bestätigen. (Nein, ich habe das nicht einfach kopiert, weil ich faul bin, sondern ich habe nachgefragt.)
pm-efficiency-module=Ein Modul zur „übertakteten Effektivität“ (so heißt es zwar nicht mehr, verdammt noch mal, 2.0), das die Geschwindigkeit des Geräts erhöht und den Energieverbrauch senkt. Aber bitte keine Hasskommentare.
pm-productivity-module=Ein produktives Produktivitätsmodul, das der Maschine ins Ohr flüstert, sie verfüge über mehr Ressourcen, als sie tatsächlich hat, und sie so glauben lässt, sie könne mit dem gleichen Aufwand mehr Produkte herstellen. Leider verstößt dies gegen mehrere Gesetze von … so ziemlich allem. Zum Glück ist das hier ein Spiel. Hör auf zu lesen und lass die Fabrik wachsen.
pm-worker-robots-storage=Erhöht die Anzahl der Gegenstände, die Logistik- und Bauroboter gleichzeitig transportieren können.
pm-basic-battery-charging=Eine fortschrittlichere Methode, Batterien aufzuladen, um Energie für den späteren Gebrauch zu speichern.
pm-mining-productivity=Erhöhte Fördermenge bei allen Erzförderern und Förderpumpen.
pm-research-productivity=Ermöglicht produktivere Forschungsmethoden.
pm-intermediate-casting=Verwendung von geschmolzenen Metallen zum direkten Gießen in grundlegende Zwischenprodukte.
pm-basic-sulfuric-acid=Ein einfaches Verfahren zur Herstellung von Schwefelsäure unter Verwendung von Schwefel und metallischen Chloriden.
pm-acidic-water-processing=Eine saure Flüssigkeit zum Auflösen der grundlegendsten Metalle für die weitere metallurgische Verarbeitung.



